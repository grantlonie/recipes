name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  # Never cancel mid-compose: interrupted recreates leave containers named
  # <id>_recipes that block the next deploy with a name conflict.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.REMOTE_APP_DIR || '/srv/apps/recipes' }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            # Drop leftovers from a failed/cancelled recreate (<id>_recipes, etc.)
            docker ps -a --format '{{.ID}} {{.Names}}' \
              | awk '$2 ~ /^[a-f0-9]+_(recipes|recipes-image-worker)$/ { print $1 }' \
              | xargs -r docker rm -f
            docker compose up -d --build --remove-orphans
            docker compose ps
